services:
  app:
    build: .
    image: magic-word:local
    restart: unless-stopped
    env_file: .env.host
    environment:
      MAGICWORD_PUBLIC_URL: https://${MAGICWORD_HOST:?Set MAGICWORD_HOST in .env.host}
      MAGICWORD_BIND: 0.0.0.0
      MAGICWORD_DATA_DIR: /data
      PORT: "8791"
    volumes:
      - inbox:/data
  https:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      MAGICWORD_HOST: ${MAGICWORD_HOST:?Set MAGICWORD_HOST in .env.host}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
  agent:
    profiles: [mcp]
    image: magic-word:local
    depends_on: [app]
    restart: unless-stopped
    command: ["node","mcp/http.mjs"]
    env_file: .env.host
    environment:
      MAGICWORD_URL: https://${MAGICWORD_HOST}
      MAGICWORD_MCP_PUBLIC_URL: https://${MAGICWORD_HOST}/mcp
      MAGICWORD_MCP_BIND: 0.0.0.0
      MAGICWORD_PASSWORD_FILE: /data/live/credentials.json
    volumes:
      - inbox:/data:ro
volumes:
  inbox:
  certificates:
  caddy_config:
